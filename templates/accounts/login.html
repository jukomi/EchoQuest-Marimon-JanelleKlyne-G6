{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:400px"><div class="card-body">
  <h3>Login</h3>
  {% for error in form.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">Email</label>{{ form.username }}</div>
    <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    <button class="btn btn-success w-100">Login</button>
  </form>
  <p class="mt-3 mb-0">No account? <a href="{% url 'register' %}">Register</a></p>
</div></div>
{% endblock %}
